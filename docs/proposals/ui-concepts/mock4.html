*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;width:390px;height:844px;overflow:hidden;position:relative}

.scr{position:absolute;inset:0;display:none;font-family:P2P;color:#fff;font-size:7px;background:url(fight-now.png);image-rendering:pixelated}
.wipe{position:absolute;left:0;top:738px;width:390px;height:106px;background:url(fight-now.png) 0 -452px;image-rendering:pixelated}
.o{text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 2px 0 #000}
.b{position:absolute;background:#17141b;border:3px solid #c8323a;outline:2px solid #000}
.b.s{border-color:#3cae5c}

.b.cd{border-color:#4a4650}.b.cd img{opacity:.25}.b.cd b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}

/* L: today's layout, bigger buttons + health numbers under them + target pill */
.L .b{width:54px;height:54px;top:744px}
.L .hp{top:808px;width:112px}.L .n{position:absolute;top:822px;width:112px;text-align:center}
/* M: one flat row glued to the bottom edge, health line on top of each pair, target tag at the enemy */
.M .wipe{top:736px;height:108px}
.M .dock{position:absolute;left:0;top:770px;width:390px;height:74px;background:rgba(12,10,14,.8);border-top:2px solid #e8c070}
.M .b{width:58px;height:58px;top:782px;outline:0}
.M .hp{top:772px;height:6px;outline:0;border:0}.M .n{position:absolute;top:757px}
.M .tag{position:absolute;left:176px;top:226px;background:rgba(12,10,14,.82);border:2px solid #ffe36e;padding:5px 7px;line-height:11px;font-size:6px;text-align:center}.M .tag b{font-size:7px;color:#ffe36e}
/* N: ghost icons (no boxes), health numbers at the heroes themselves */
.N .g{position:absolute;top:762px;width:48px;height:48px}
.N .g img{width:48px;height:48px;filter:drop-shadow(2px 2px 0 #000) drop-shadow(-1px -1px 0 #000)}
.N .g u{position:absolute;left:6px;right:6px;bottom:-9px;height:4px;background:#c8323a;outline:1px solid #000}.N .g.s u{background:#3cae5c}
.N .g.cd img{opacity:.3}.N .g.cd u{background:#4a4650}.N .g.cd b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.N .num{position:absolute;font-size:7px}
.N .line{position:absolute;left:0;top:50px;width:390px;text-align:center;font-size:7px}.N .line b{color:#ffe36e}.N .line span{color:#9fe8ff}
/* O: everything in the two bottom corners (thumb grid right, health list left) */
.O .b{width:54px;height:54px;outline-width:2px}
.O .row{position:absolute;left:8px;height:28px;width:176px}
.O .row .face{left:0;top:0;width:24px;height:24px}.O .row .face img{height:60px}
.O .row .nm{position:absolute;left:32px;top:0;font-size:6px}.O .row .hp{left:32px;top:12px;width:92px}.O .row .n{position:absolute;left:132px;top:11px}
.O .col{position:absolute;top:715px;width:54px;text-align:center;font-size:6px}
