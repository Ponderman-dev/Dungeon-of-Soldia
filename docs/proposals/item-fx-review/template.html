<title>New Item Effects</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* One card per new item effect: the recorded clip (real game, no sound), the item(s), what it shows, OK / CHANGE + a note. */
:root {
  color-scheme: dark;
  --bg: #07070b; --win: #000; --line: #fff; --fg: #fff; --muted: #b4b4c4; --gold: #ffd84a; --red: #ff7a5a; --green: #6ee07a;
  --pixel: 'Press Start 2P', ui-monospace, monospace;
  --body: 'IBM Plex Sans', system-ui, sans-serif;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); margin: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 22px 60px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
h1 { font: 20px/1.4 var(--pixel); margin: 0; text-wrap: balance; }
h3 { font: 12px/1.5 var(--pixel); margin: 0; color: var(--gold); }
.lede { color: var(--muted); max-width: 70ch; margin: 8px 0 0; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 10px; font: 8px var(--pixel); color: var(--muted); }
button { font: 8px/1 var(--pixel); color: var(--fg); background: #000; cursor: pointer; padding: 11px 13px; border: 2px solid var(--line); }
button:focus-visible, textarea:focus-visible, video:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.v-ok.on { background: var(--green); border-color: var(--green); color: #000; }
.v-change.on { background: var(--red); border-color: var(--red); color: #000; }
.win { background: var(--win); border: 2px solid var(--line); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.item { padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.item.ok { border-color: var(--green); } .item.change { border-color: var(--red); }
.media { display: block; width: 100%; aspect-ratio: 390 / 600; background: #111; image-rendering: pixelated; }
.items { display: grid; gap: 6px; }
.it { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.it canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.it b { color: var(--fg); font-weight: 600; }
.item p { margin: 0; font-size: 14px; }
.open { color: var(--gold); }
.verdict { display: flex; gap: 6px; }
textarea { width: 100%; box-sizing: border-box; min-height: 54px; resize: vertical; background: #0b0b10; color: var(--fg); border: 1px solid #555; padding: 8px; font: 14px/1.4 var(--body); }
.saved { font: 8px var(--pixel); color: var(--muted); min-height: 1em; }
</style>

<div class="wrap">
  <header>
    <h1>New Item Effects</h1>
    <p class="lede">Each new item going off in a real fight (floor 6, recorded from the game, no sound). Chances are pushed up so you see it quickly. Mark each OK or CHANGE and write what you want different. Everything is saved for Claude.</p>
  </header>
  <div class="bar" id="progress"></div>
  <textarea id="note-general" aria-label="General note" placeholder="General note (anything about all of them)"></textarea>
  <main class="grid" id="main"></main>
</div>

<script>
/*DATA*/
const notes = {};
let store = null;
const progress = () => { const done = CLIPS.filter((c) => notes[c.id]?.verdict).length; document.getElementById('progress').textContent = `${done} / ${CLIPS.length} REVIEWED`; };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const save = async (id, out) => {
  progress();
  if (!store) { if (out) out.textContent = 'NOT SAVED IN THIS VIEW'; return; }
  try { await store.doc(id).set({ ...notes[id], updatedAt: new Date().toISOString() }); if (out) out.textContent = 'SAVED'; } catch { if (out) out.textContent = 'COULD NOT SAVE, TRY AGAIN'; }
};
function icon({ p, r }) {
  const c = document.createElement('canvas'); c.width = r[0].length; c.height = r.length;
  const g = c.getContext('2d');
  r.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = p['abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.indexOf(ch)]; g.fillRect(x, y, 1, 1); } }));
  return c;
}
const main = document.getElementById('main');
for (const c of CLIPS) {
  const card = el('article', 'item win'); card.dataset.id = c.id;
  card.innerHTML = `<h3>${esc(c.title)}</h3><video class="media" muted loop playsinline controls preload="metadata" aria-label="${esc(c.title)}"><source src="clips/${c.id}.mp4" type="video/mp4"><source src="clips/${c.id}.webm" type="video/webm"></video>`;
  const list = el('div', 'items');
  for (const it of c.items) { const row = el('div', 'it'); row.appendChild(icon(it.icon)); row.appendChild(el('div', '', `<b>${esc(it.name)}</b> <span style="color:${it.color}">${esc(it.rarity)}</span><br>${esc(it.desc)}`)); list.appendChild(row); }
  card.appendChild(list);
  card.appendChild(el('p', '', esc(c.shows)));
  if (c.open) card.appendChild(el('p', 'open', 'Open: ' + esc(c.open)));
  const v = el('div', 'verdict'); const ok = el('button', 'v-ok', 'OK'); const ch = el('button', 'v-change', 'CHANGE'); ok.type = ch.type = 'button'; v.append(ok, ch);
  const ta = el('textarea'); ta.placeholder = 'What should change?'; ta.setAttribute('aria-label', 'Note for ' + c.title);
  const out = el('div', 'saved');
  card.append(v, ta, out);
  card.paint = () => { const n = notes[c.id] || {}; ok.classList.toggle('on', n.verdict === 'ok'); ch.classList.toggle('on', n.verdict === 'change'); card.classList.toggle('ok', n.verdict === 'ok'); card.classList.toggle('change', n.verdict === 'change'); if (document.activeElement !== ta) ta.value = n.text || ''; };
  const set = (k) => { notes[c.id] = { ...(notes[c.id] || {}), verdict: notes[c.id]?.verdict === k ? null : k }; card.paint(); save(c.id, out); };
  ok.onclick = () => set('ok'); ch.onclick = () => set('change');
  ta.onchange = () => { notes[c.id] = { ...(notes[c.id] || {}), text: ta.value, verdict: notes[c.id]?.verdict || (ta.value.trim() ? 'change' : null) }; card.paint(); save(c.id, out); };
  main.appendChild(card);
}
const gen = document.getElementById('note-general');
gen.onchange = () => { notes._general = { text: gen.value }; save('_general'); };
progress();
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) e.target.play().catch(() => {}); else e.target.pause(); }), { threshold: 0.4 });
document.querySelectorAll('video').forEach((v) => io.observe(v));
(async () => {
  const db = await (window.claude ? claude.use('db') : null);
  if (!db) { document.querySelectorAll('.saved').forEach((s) => (s.textContent = 'NOT SAVED IN THIS VIEW')); return; }
  store = db.collection('review');
  store.onSnapshot((snap) => {
    for (const d of snap.docs) notes[d.id] = d.data();
    document.querySelectorAll('[data-id]').forEach((x) => x.paint && x.paint());
    if (document.activeElement !== gen) gen.value = notes._general?.text || '';
    progress();
  });
})();
</script>
